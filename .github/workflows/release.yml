name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux binaries are built against glibc 2.28 with cargo-zigbuild, independent of the runner.
          - os: ubuntu-latest
            script: packaging/linux/package.sh target/distrib
          - os: windows-latest
            script: pwsh packaging/windows/package.ps1 target/distrib
          - os: macos-latest
            script: packaging/macos/package.sh target/distrib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      # A tag v<version> sets the version of the binaries, the archives and the app bundle.
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: perl -pi -e 's/^version = "[^"]*"/version = "'"${GITHUB_REF_NAME#v}"'"/' Cargo.toml
      - shell: bash
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.os }}
          path: |
            target/distrib/*.tar.gz
            target/distrib/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/distrib/*.tar.gz
            target/distrib/*.zip
