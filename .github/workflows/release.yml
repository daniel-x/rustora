name: Release

# A tag v<version> publishes a release. A push to main replaces the prerelease "dev" with a development build.
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux binaries are built against glibc 2.28 with cargo-zigbuild, independent of the runner.
          - os: ubuntu-latest
            script: packaging/linux/package.sh target/distrib
          - os: windows-latest
            script: pwsh packaging/windows/package.ps1 target/distrib
          - os: macos-latest
            script: packaging/macos/package.sh target/distrib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      # A tag v<version> sets the version of the binaries, the archives and the app bundle. A development build
      # gets the version of Cargo.toml with -dev.g<commit>.
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: perl -pi -e 's/^version = "[^"]*"/version = "'"${GITHUB_REF_NAME#v}"'"/' Cargo.toml
      - if: github.ref == 'refs/heads/main'
        shell: bash
        run: perl -pi -e 's/^version = "([^"]*)"/version = "$1-dev.g'"${GITHUB_SHA::7}"'"/' Cargo.toml
      - shell: bash
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.os }}
          path: |
            target/distrib/*.tar.gz
            target/distrib/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/distrib/*.tar.gz
            target/distrib/*.zip

  dev-release:
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    concurrency:
      group: dev-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Development build" \
            --notes "Built from ${GITHUB_SHA::7} on main. It is replaced by every push to main and is not a stable release."
