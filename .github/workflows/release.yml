name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu runner keeps the glibc requirement of the Linux binaries low.
          - os: ubuntu-22.04
            script: packaging/linux/package.sh openra target/distrib
          - os: windows-latest
            script: pwsh packaging/windows/package.ps1 openra target/distrib
          - os: macos-latest
            script: packaging/macos/package.sh openra target/distrib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: OpenRA/OpenRA
          ref: release-20250330
          path: openra
          sparse-checkout: |
            mods/common
            mods/common-content
            mods/ra
            mods/ra-content
            global mix database.dat
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - shell: bash
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.os }}
          path: |
            target/distrib/*.tar.gz
            target/distrib/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/distrib/*.tar.gz
            target/distrib/*.zip
