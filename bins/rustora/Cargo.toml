[package]
name = "rustora"
description = "rustora game client: renders a world and plays back replays"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustora-audio = { path = "../../crates/rustora-audio" }
rustora-core = { path = "../../crates/rustora-core" }
rustora-engine = { path = "../../crates/rustora-engine" }
rustora-formats = { path = "../../crates/rustora-formats" }
rustora-fs = { path = "../../crates/rustora-fs" }
rustora-game = { path = "../../crates/rustora-game" }
rustora-ui = { path = "../../crates/rustora-ui" }
rustora-launch = { path = "../../crates/rustora-launch" }
rustora-mods-common = { path = "../../crates/rustora-mods-common" }
rustora-render = { path = "../../crates/rustora-render" }
rustora-scripting = { path = "../../crates/rustora-scripting" }
rustora-net = { path = "../../crates/rustora-net" }
rustora-server = { path = "../../crates/rustora-server" }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
winit = "0.30"
arboard = "3"
image-webp = "0.2"

[lints]
workspace = true
