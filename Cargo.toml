[workspace]
resolver = "2"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.1.13"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.lints.clippy]
# Ported signatures mirror the C# ones.
type_complexity = "allow"
too_many_arguments = "allow"
# Activity and effect constructors return their shared trait object, like C# `new` used as `Activity`.
new_ret_no_self = "allow"
# `is_multiple_of` needs Rust 1.87, newer than the declared rust-version.
manual_is_multiple_of = "allow"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev]
opt-level = 1
# C# integer arithmetic is unchecked; the simulation must wrap the same way.
overflow-checks = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1

# Packaged builds: whole-program optimization and no debug info, for smaller and faster binaries.
[profile.dist]
inherits = "release"
debug = 0
strip = true
lto = "fat"
codegen-units = 1

[profile.test]
overflow-checks = false
