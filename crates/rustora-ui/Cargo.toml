[package]
name = "rustora-ui"
description = "rustora user interface: chrome assets, fonts, messages and the widget tree loaded from chrome layouts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustora-client = { path = "../rustora-client" }
rustora-core = { path = "../rustora-core" }
rustora-formats = { path = "../rustora-formats" }
rustora-fs = { path = "../rustora-fs" }
rustora-net = { path = "../rustora-net" }
rustora-game = { path = "../rustora-game" }
rustora-render = { path = "../rustora-render" }
rustora-engine = { path = "../rustora-engine" }
rustora-mods-common = { path = "../rustora-mods-common" }
rustora-scripting = { path = "../rustora-scripting" }
indexmap = "2"
png = "0.18"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
swash = "0.2"
fluent-bundle = "0.16"
unic-langid = "0.9"

[lints]
workspace = true
