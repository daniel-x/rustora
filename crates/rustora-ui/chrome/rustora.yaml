Label@LAG_DISPLAY:
	X: 10
	Y: 70
	Width: 512
	Height: 120
	Font: Regular
	Align: Left
	VAlign: Top
	Contrast: true

Container@GENERAL_CHAT:
	Logic: GeneralChatLogic
	Children:
		Background@GENERAL_CHAT_PANEL:
			X: CHAT_X
			Y: CHAT_Y
			Width: CHAT_WIDTH
			Height: CHAT_HEIGHT
			Children:
				Label@TITLE:
					Y: 12
					Width: PARENT_WIDTH
					Height: 25
					Font: Bold
					Align: Center
				ScrollPanel@CHAT_DISPLAY:
					X: 15
					Y: 45
					Width: PARENT_WIDTH * 3 / 4 - 20
					Height: PARENT_HEIGHT - 45 - 50
					TopBottomSpacing: 2
					ItemSpacing: 2
				TextField@CHAT_TEXTFIELD:
					X: 15
					Y: PARENT_HEIGHT - HEIGHT - 15
					Width: PARENT_WIDTH * 3 / 4 - 20
					Height: 25
				ScrollPanel@USER_LIST:
					X: PARENT_WIDTH * 3 / 4
					Y: 45
					Width: PARENT_WIDTH / 4 - 15
					Height: PARENT_HEIGHT - 45 - 15
					TopBottomSpacing: 2
					ItemSpacing: 2
					ScrollBar: Hidden
					ScrollbarWidth: 0

Label@GENERAL_CHAT_USER:
	X: 5
	Height: 16
	Shadow: true
