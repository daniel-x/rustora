[package]
name = "rustora-server"
description = "OpenRA compatible game server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
base64 = "0.23"
igd-next = "0.18"
indexmap = "2"
rsa = "0.9"
rustora-core = { path = "../rustora-core" }
rustora-derive = { path = "../rustora-derive" }
rustora-fs = { path = "../rustora-fs" }
rustora-game = { path = "../rustora-game" }
rustora-net = { path = "../rustora-net" }
sha1 = { version = "0.10", features = ["oid"] }
socket2 = "0.5"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
rand = "0.8"

[lints]
workspace = true
