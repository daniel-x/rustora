[package]
name = "rustora-server"
description = "OpenRA compatible game server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23"
igd-next = "0.18"
indexmap = "2"
rsa = "0.9"
rustora-core = { path = "../rustora-core" }
rustora-derive = { path = "../rustora-derive" }
rustora-engine = { path = "../rustora-engine" }
rustora-fs = { path = "../rustora-fs" }
rustora-game = { path = "../rustora-game" }
rustora-mods-common = { path = "../rustora-mods-common" }
rustora-net = { path = "../rustora-net" }
sha1 = { version = "0.10", features = ["oid"] }
socket2 = "0.5"

[dev-dependencies]
rand = "0.8"

[lints]
workspace = true
