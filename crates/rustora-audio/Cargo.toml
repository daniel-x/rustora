[package]
name = "rustora-audio"
description = "rustora audio output: a software mixer on the system audio device"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustora-core = { path = "../rustora-core" }
rustora-engine = { path = "../rustora-engine" }
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18"

[lints]
workspace = true

[dev-dependencies]
rustora-formats = { path = "../rustora-formats" }
