[package]
name = "rustora-engine"
description = "Simulation engine of rustora: world, actors, traits, activities, orders"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustora-client = { path = "../rustora-client" }
rustora-core = { path = "../rustora-core" }
rustora-derive = { path = "../rustora-derive" }
rustora-formats = { path = "../rustora-formats" }
rustora-fs = { path = "../rustora-fs" }
rustora-game = { path = "../rustora-game" }
rustora-net = { path = "../rustora-net" }
indexmap = "2"
smallvec = { version = "1", features = ["union", "const_generics"] }
thiserror = "2"
log = "0.4"

[lints]
workspace = true
