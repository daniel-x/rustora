[package]
name = "rustora-fs"
description = "Virtual file system of rustora: folders, zip and mix packages, mount points"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blowfish = "0.10"
crc32fast = "1"
num-bigint = "0.5"
base64 = "0.23"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
log = "0.4"

[lints]
workspace = true
